<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Roshambo Swarm Simulation</title>
    <meta name="description" content="Modular industrial-grade Rock-Paper-Scissors swarm simulation with boundary physics, spatial partitioning, and adaptive AI." />
    <meta property="og:title" content="Roshambo Swarm Simulation" />
    <meta property="og:description" content="Modular industrial-grade Rock-Paper-Scissors swarm simulation with boundary physics, spatial partitioning, and adaptive AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Simulation Arena Viewport -->
    <main id="stage" role="region" aria-label="Roshambo Swarm Arena">
      <div id="walls" aria-hidden="true"></div>
    </main>

    <!-- Floating Glassmorphism Control Panel -->
    <aside id="panel" class="panel hide" role="region" aria-label="Simulation Controls">
      <!-- Speed Slider -->
      <section class="top" aria-label="Simulation Speed Controls">
        <label for="speed" class="sr-only" style="display:none">Simulation Speed</label>
        <input
          type="range"
          id="speed"
          min="0"
          max="100"
          value="20"
          aria-label="Simulation speed controller"
        />
        <span class="val" id="speedVal" aria-live="polite">20</span>
      </section>

      <!-- Scene Presets Segmented Buttons -->
      <nav class="seg" id="seg" aria-label="Obstacle Scene Presets"></nav>

      <!-- Faction Population Sliders and Aggression Display -->
      <section class="rows" id="rows" aria-label="Faction Population and Aggression"></section>

      <!-- Global Playback Actions -->
      <section class="controls" aria-label="Playback Actions">
        <button id="btnStart" type="button" aria-label="Start Simulation">Start</button>
        <button id="btnStop" type="button" class="on" aria-label="Stop Simulation">Stop</button>
        <button id="btnReset" type="button" aria-label="Reset Simulation">Reset</button>
      </section>
    </aside>

    <!-- Drawer Toggle Button -->
    <button
      class="hamb"
      id="hamb"
      type="button"
      title="Toggle control panel"
      aria-label="Toggle control panel"
      aria-controls="panel"
    >
      <i class="fa-solid fa-sliders" aria-hidden="true"></i>
    </button>

    <!-- Modular Pure JS Entry Point -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
